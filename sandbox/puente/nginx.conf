# Puente entre el navegador del host y el servicio web, que vive en la red interna sandbox
# sin ruta a internet. El puente solo reenvía HTTP a web:8000 y no ejecuta código del agente.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
