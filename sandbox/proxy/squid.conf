# Proxy de salida del sandbox: solo túneles HTTPS (CONNECT al puerto 443) hacia los
# dominios de /etc/squid/permitidos.txt. Todo lo demás recibe 403 y queda en el log.
http_port 3128

acl puerto_https port 443
acl CONNECT method CONNECT
# -n: no resolver al revés; una IP literal nunca coincide con un dominio permitido.
acl permitidos dstdomain -n "/etc/squid/permitidos.txt"

http_access deny !CONNECT
http_access deny !puerto_https
http_access allow permitidos
http_access deny all

# Sin caché y sin cabeceras que identifiquen al cliente.
cache deny all
cache_mem 8 MB
via off
forwarded_for delete
httpd_suppress_version_string on

# Solo se registran conexiones con petición: el healthcheck (nc -z) abre y cierra sin enviar nada.
acl con_peticion has request
logformat sandbox %{%Y-%m-%dT%H:%M:%S}tl %>a %Ss/%03>Hs %rm %ru
access_log stdio:/dev/stdout sandbox con_peticion
cache_log stdio:/dev/stderr
pid_filename none
shutdown_lifetime 1 seconds
